<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAI CLUB Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ============ LOGIN POPUP (FIRST TIME) ============ -->
    <div id="loginPopup" class="login-overlay">
        <div class="login-card">
            <div class="login-logo">
                <img src="../../../USER/LOGO/logo.png" alt="JAI CLUB">
            </div>
            <h2>Welcome to JAI CLUB Chat</h2>
            <p class="login-sub">Please enter your details to start chatting</p>

            <label class="f-label">User Name</label>
            <input class="f-input" type="text" id="lgName" placeholder="Enter your name">

            <label class="f-label">Game UID</label>
            <input class="f-input" type="text" id="lgUid" placeholder="Enter your game UID (6 digits)" maxlength="6" inputmode="numeric" oninput="onlyDigits(this)">

            <label class="f-label">Registered Mobile Number</label>
            <input class="f-input" type="tel" id="lgMobile" placeholder="Enter registered mobile number" maxlength="10" inputmode="numeric" oninput="onlyDigits(this)">

            <label class="f-label">Account Password</label>
            <input class="f-input" type="password" id="lgPass" placeholder="Enter your account password">

            <button class="btn btn-pink btn-block" onclick="doLogin()">START CHAT</button>
            <p id="lgError" class="login-error"></p>
        </div>
    </div>

    <!-- ============ PROBLEM SELECT POPUP ============ -->
    <div id="problemPopup" class="login-overlay hidden">
        <div class="login-card">
            <div class="login-logo">
                <img src="../../../USER/LOGO/logo.png" alt="JAI CLUB">
            </div>
            <h2>Select Your Problem</h2>
            <p class="login-sub">What issue are you facing?</p>

            <div class="problem-options">
                <button class="problem-btn" onclick="selectProblem('Deposit Problem')">
                    <span class="problem-emoji">💰</span>
                    <span>Deposit Problem</span>
                </button>
                <button class="problem-btn" onclick="selectProblem('Withdrawal Problem')">
                    <span class="problem-emoji">💸</span>
                    <span>Withdrawal Problem</span>
                </button>
                <button class="problem-btn" onclick="selectProblem('Game Account Problem')">
                    <span class="problem-emoji">🎮</span>
                    <span>Game Account Problem</span>
                </button>
                <button class="problem-btn" onclick="selectProblem('Other Problem')">
                    <span class="problem-emoji">📌</span>
                    <span>Other Problem</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ============ MAIN CHAT ============ -->
    <div id="chatPage" class="chat-page hidden">

        <div class="chat-top">
            <div class="chat-top-info">
                <div class="chat-avatar" id="myAvatar">U</div>
                <div>
                    <div class="chat-top-name" id="myName">User</div>
                    <div class="chat-top-status">JAI CLUB Support — Online</div>
                </div>
            </div>
            <div class="menu-wrap">
                <button class="menu-btn" onclick="toggleMenu()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </button>
                <div id="menuDropdown" class="menu-dropdown hidden">
                    <button class="menu-item" onclick="doLogout()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="chat-date-line">Today</div>
            <div class="chat-welcome">Ask your question, we will reply soon.</div>
        </div>

        <!-- REPLY BAR -->
        <div id="replyBar" class="reply-bar hidden">
            <span>Replying to</span>
            <span id="replyText"></span>
            <button onclick="cancelReply()">×</button>
        </div>

        <div class="chat-input-row">
            <button class="tool-btn" onclick="pickImage()">
                <img src="icon-image.svg" alt="Image" onerror="this.outerHTML='Image'" class="tool-ic">
            </button>
            <button class="tool-btn" onclick="pickFile()">
                <img src="icon-file.svg" alt="File" onerror="this.outerHTML='PDF'" class="tool-ic">
            </button>
            <input class="chat-input" id="msgInput" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
            <button class="send-btn" onclick="sendMsg()">
                <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#fff" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
            </button>
        </div>
    </div>

    <!-- ============ EDIT POPUP ============ -->
    <div id="editPopup" class="login-overlay">
        <div class="login-card">
            <h2>Edit Message</h2>
            <textarea class="f-input" id="editText" style="min-height:80px"></textarea>
            <div class="row-2">
                <button class="btn btn-ghost2" onclick="closeEdit()">Cancel</button>
                <button class="btn btn-green" onclick="saveEdit()">Save</button>
            </div>
        </div>
    </div>

    <input type="file" id="imgPick" accept="image/*" hidden>
    <input type="file" id="filePick" accept=".pdf,.doc,.docx,.txt,.xls,.xlsx" hidden>

    <!-- Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/telegram-config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
