<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAI CLUB</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="LOGO/logo.png">
</head>
<body>

    <!-- ============ HEADER ============ -->
    <header>
        <nav class="nav">
            <a href="index.html" class="brand">
                <img src="LOGO/logo.png" alt="JAI CLUB Logo">
                <div class="brand-text">
                    <span class="brand-name">JAI CLUB</span>
                    <span class="brand-tag">Support Center</span>
                </div>
            </a>
        </nav>
    </header>

    <!-- ============ HOME — SIRF 7 PROBLEM OPTIONS ============ -->
    <main class="home">
        <div class="home-logo">
            <img src="LOGO/ICONS/BIG LOGO.jpg" alt="JAI CLUB Big Logo">
        </div>
        <div class="opt-grid">
            <button class="opt-tile" data-opt="chat">
                <span class="opt-img">
                    <img src="LOGO/ICONS/ONLLINE-CHAT.jpg" alt="Chat">
                </span>
                <span class="opt-label">Online Chat</span>
            </button>
        </div>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer>
        <a href="index.html" class="brand">
            <img src="LOGO/logo.png" alt="JAI CLUB Logo">
            <span class="brand-name">JAI CLUB</span>
        </a>
        <p>© <span id="year"></span> JAI CLUB — Support Center</p>
    </footer>

    <!-- ============ UID & EMAIL POPUP ============ -->
    <div id="detailPopup" class="popup">
        <div class="popup-card">
            <button class="popup-close" onclick="closePopup()">&times;</button>
            <div class="popup-icon-wrap">
                <img src="LOGO/logo.png" alt="JAI CLUB" class="popup-logo-img">
            </div>
            <h2 class="popup-title">Welcome Back!</h2>
            <p class="popup-desc">Enter your details to start chatting with support</p>

            <div class="popup-form">
                <div class="input-group">
                    <label class="input-label">Game UID</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>
                        </span>
                        <input class="input-field" type="text" id="popUid" placeholder="Enter 6-digit UID" maxlength="6" inputmode="numeric" oninput="onlyDigits(this)">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </span>
                        <input class="input-field" type="email" id="popEmail" placeholder="Enter your email">
                    </div>
                </div>
            </div>

            <button class="popup-btn" onclick="submitDetails()">
                <span>Continue</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <p id="popError" class="popup-error"></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
